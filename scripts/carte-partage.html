<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Gabarit de la carte de partage</title>
  <!--
    Gabarit de l'image `partage.png` (1200 x 630), celle qu'affichent les messageries et les
    reseaux quand quelqu'un colle un lien vers le site.

    ⚠️ Ce n'est PAS une page du site : elle vit dans `scripts/` parce qu'elle n'est pas destinee
    a etre servie, seulement rendue une fois pour produire le PNG. Elle est versionnee pour que
    l'image soit REFAISABLE : une image binaire dont le gabarit n'existe nulle part devient
    intouchable des que la marque bouge.

    ⚠️ Les polices sont celles de l'application (Fraunces, IBM Plex Sans), pas des polices
    choisies pour cette image : la vignette est souvent la PREMIERE chose que quelqu'un voit du
    produit, donc c'est le dernier endroit ou se permettre une typographie differente.

    Pour regenerer, depuis la racine du depot :
      python -m http.server 8099
      chrome --headless=new --window-size=1200,630 \
             --screenshot=partage.png http://127.0.0.1:8099/scripts/carte-partage.html

    Les polices sont chargees par chemin relatif remontant d'un niveau : le rendu doit se faire
    en servant le depot, pas en ouvrant le fichier directement.
  -->
  <style>
    @font-face {
      font-family: 'Fraunces';
      src: url('../polices/Fraunces-Variable.woff2') format('woff2-variations');
      font-weight: 100 900;
    }
    @font-face {
      font-family: 'IBM Plex Sans';
      src: url('../polices/IBMPlexSans-Variable.woff2') format('woff2-variations');
      font-weight: 100 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      background: #0e0e16;
      color: #f2f0ec;
      font-family: 'IBM Plex Sans', sans-serif;
      position: relative;
      display: flex; flex-direction: column; justify-content: center;
      padding: 0 76px;
    }
    /* Le meme anneau que le site : la frontiere, pas le halo. */
    .anneau, .anneau-interieur {
      position: absolute; border-radius: 50%;
      top: 50%; transform: translateY(-50%); pointer-events: none;
    }
    .anneau {
      width: 720px; height: 720px; right: -200px;
      border: 1px solid rgba(90,159,212,.22);
      background: radial-gradient(circle at 50% 50%, rgba(70,130,180,.10), transparent 68%);
    }
    .anneau-interieur {
      width: 360px; height: 360px; right: -20px;
      border: 1px solid rgba(90,159,212,.34);
      background: radial-gradient(circle at 50% 50%, rgba(70,130,180,.13), transparent 74%);
    }
    .marque {
      position: relative; z-index: 2;
      display: flex; align-items: center; gap: 15px;
      font-family: 'Fraunces', serif; font-weight: 600; font-size: 34px;
      letter-spacing: -.01em;
    }
    h1 {
      position: relative; z-index: 2; max-width: 790px; margin-top: 34px;
      font-family: 'Fraunces', serif; font-weight: 600;
      font-size: 70px; line-height: 1.06; letter-spacing: -.02em;
    }
    h1 em { color: #5a9fd4; font-style: italic; }
    .pied {
      position: relative; z-index: 2; margin-top: 40px;
      padding-top: 26px; border-top: 1px solid rgba(255,255,255,.16);
      max-width: 790px;
      font-size: 21px; color: #8f8ea0; line-height: 1.5;
    }
    .pied strong { color: #f2f0ec; font-weight: 600; }
  </style>
</head>
<body>
  <div class="anneau"></div>
  <div class="anneau-interieur"></div>

  <div class="marque">
    <svg width="38" height="38" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="12" fill="none" stroke="#4682b4" stroke-width="2"/><circle cx="16" cy="16" r="6" fill="#4682b4"/></svg>
    Oyant
  </div>

  <h1>Dictez vos notes.<br><em>Personne d'autre ne les entend.</em></h1>

  <p class="pied"><strong>La reconnaissance vocale tourne sur votre ordinateur.</strong> Gratuit, sans compte, Windows et Linux. Édité par BREIZHZION.</p>
</body>
</html>

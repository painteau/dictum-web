<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Marque Oyant : un disque central entoure d'un anneau SEPARE.
       Geometrie identique a l'icone de l'application (bzhzion/oyant-app, assets/icon.png,
       generee par scripts/generer_icones.py) : disque r=6, anneau de r=11 a r=13.
       L'anneau est trace en `stroke` centre sur r=12 avec une epaisseur de 2, ce qui est
       exactement equivalent et a l'avantage de ne rien peindre entre le disque et l'anneau :
       le motif reste donc juste sur n'importe quel fond.
       Ce fichier portait auparavant une marque DIFFERENTE (un disque plein evide en son centre). -->
  <circle cx="16" cy="16" r="15" fill="#0e0e16"/>
  <circle cx="16" cy="16" r="12" fill="none" stroke="#4682b4" stroke-width="2"/>
  <circle cx="16" cy="16" r="6" fill="#4682b4"/>
</svg>
